[project]
name = "interface-web"
version = "0.1.0"
description = "Web interface for the meteorological balloon readings database"
readme = "README.md"
authors = [
    { name = "Sa-RSt", email = "sasha.rodelasteidle@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faker>=40.47.0",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
]

[project.scripts]
interface-web = "interface_web:main"
seed-db = "interface_web.seed:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
