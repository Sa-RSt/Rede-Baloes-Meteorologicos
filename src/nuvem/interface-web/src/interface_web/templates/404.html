{% extends "base.html" %}

{% block title %}Página não encontrada{% endblock %}

{% block content %}
<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body p-4 p-md-5">
          <p class="display-6 mb-1">404</p>
          <h1 class="h3 mb-3">Página não encontrada</h1>
          <p class="text-muted mb-4">
            O balão ou o sensor solicitado não existe no banco de dados.
            Escolha uma opção no menu de balões acima.
          </p>
          <a class="btn btn-primary" href="{{ url_for('main.index') }}">Voltar ao início</a>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
